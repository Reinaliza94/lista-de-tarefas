<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f6fa">
  <title>Minhas tarefas</title>
  <link rel="stylesheet" href="index.css">
  <script src="index.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="page-header">
      <p class="eyebrow">ORGANIZE SEU DIA</p>
      <h1>Minhas tarefas<span>.</span></h1>
      <p class="subtitle">Um passo de cada vez. Você consegue!</p>
    </header>

    <section class="task-card" aria-label="Lista de tarefas">
      <form class="task-form" id="task-form">
        <label class="sr-only" for="task-input">Nova tarefa</label>
        <input
          id="task-input"
          name="task"
          type="text"
          placeholder="O que você precisa fazer?"
          maxlength="120"
          autocomplete="off"
          required
        >
        <button class="add-button" type="submit">Adicionar</button>
      </form>

      <div class="list-toolbar">
        <p class="task-count" id="task-count" aria-live="polite"></p>
        <nav class="filters" aria-label="Filtrar tarefas">
          <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">Todas</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Pendentes</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Concluídas</button>
        </nav>
      </div>

      <ul class="task-list" id="task-list" aria-label="Tarefas"></ul>

      <div class="empty-state" id="empty-state">
        <span class="empty-icon" aria-hidden="true">✓</span>
        <p id="empty-message">Tudo pronto por aqui.</p>
        <span>Adicione uma tarefa para começar.</span>
      </div>

      <footer class="list-footer">
        <span id="remaining-count"></span>
        <button class="clear-button" id="clear-completed" type="button" disabled>Limpar concluídas</button>
      </footer>
    </section>

    <p class="page-note">Suas tarefas ficam salvas neste dispositivo.</p>
  </main>
</body>
</html>
